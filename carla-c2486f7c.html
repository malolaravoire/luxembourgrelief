<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Pour Carla</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:32px;background:radial-gradient(circle at 30% 20%,#3471e0 0%,#2259c4 40%,#13264a 100%);color:#fff;font-family:Georgia,"Times New Roman",serif;text-align:center}
main{max-width:640px;animation:in 1.6s ease both}
small{display:block;letter-spacing:.35em;text-transform:uppercase;font:600 13px/1 system-ui,sans-serif;opacity:.75;margin-bottom:28px}
h1{font-size:clamp(34px,8vw,64px);line-height:1.1;margin:0 0 22px;font-weight:700}
p{font-size:clamp(20px,4.6vw,28px);line-height:1.45;margin:0;opacity:.95}
hr{width:64px;border:0;height:2px;background:rgba(255,255,255,.55);margin:30px auto}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main{animation:none}}
</style>
</head>
<body>
<main>
<small>Pour Carla</small>
<h1>Carla a 1000/10 aujourd'hui.</h1>
<hr>
<p>Elle est super belle, et je l'aime très fort.</p>
</main>
</body>
</html>
